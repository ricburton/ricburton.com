<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bay Area Webcam Grid — Richard Burton</title>
<meta name="description" content="A 3D synthwave terrain map of the San Francisco Bay Area with live webcams at Fort Funston, Mussel Rock, Mt Tamalpais and Mt Diablo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 26 L12 8 L18 18 L23 10 L30 26 Z' fill='none' stroke='%2300e5ff' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#04071a;
  --cyan:#00e5ff;
  --blue:#1d7dff;
  --ink:#bfe9ff;
  --dim:rgba(160,215,255,0.55);
  --panel:rgba(5,11,30,0.88);
  --edge:rgba(0,229,255,0.35);
  --pink:#ff2d95;
}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{
  font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#scene{position:fixed;inset:0;display:block}

/* CRT scanlines + vignette over everything */
#crt{
  position:fixed;inset:0;pointer-events:none;z-index:30;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,0.14) 0px,rgba(0,0,0,0.14) 1px,transparent 1px,transparent 3px),
    radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(2,4,14,0.55) 100%);
  mix-blend-mode:multiply;
}

/* ── HUD ── */
.hud{position:fixed;z-index:20;pointer-events:none}
#hud-top{top:22px;left:26px}
#hud-top a.back{
  pointer-events:auto;display:inline-block;margin-bottom:10px;
  color:var(--dim);text-decoration:none;font-size:11px;letter-spacing:2px;text-transform:uppercase;
}
#hud-top a.back:hover{color:var(--cyan)}
#hud-top h1{
  font-size:clamp(18px,3vw,28px);font-weight:700;letter-spacing:6px;text-transform:uppercase;
  color:#eaffff;
  text-shadow:0 0 6px rgba(0,229,255,0.9),0 0 24px rgba(0,140,255,0.7),0 0 60px rgba(0,90,255,0.5);
}
#hud-top h1 span{color:var(--cyan)}
#hud-top .sub{
  margin-top:8px;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);
}
#hud-top .sub b{color:var(--cyan);font-weight:400}

#hud-scan{left:26px;bottom:24px;font-size:10px;letter-spacing:2px;text-transform:uppercase;line-height:1.9;color:var(--dim)}
#hud-scan .bar{
  width:150px;height:3px;background:rgba(0,229,255,0.12);margin:4px 0 8px;position:relative;overflow:hidden;
}
#hud-scan .bar i{position:absolute;left:0;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,var(--cyan));box-shadow:0 0 8px var(--cyan)}
#hud-scan .val{color:var(--cyan);text-shadow:0 0 8px rgba(0,229,255,0.8)}

#hud-hint{right:26px;bottom:24px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);text-align:right;line-height:1.9}

/* ── cam chips ── */
#chips{
  position:fixed;z-index:22;left:50%;transform:translateX(-50%);bottom:20px;
  display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:center;max-width:92vw;
}
.chip{
  font:inherit;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  color:var(--ink);background:rgba(6,13,34,0.75);border:1px solid rgba(0,229,255,0.25);
  padding:9px 14px;border-radius:3px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:all .25s;display:flex;align-items:center;gap:8px;
}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--pink);box-shadow:0 0 8px var(--pink);animation:blink 1.6s infinite}
.chip:hover,.chip.active{border-color:var(--cyan);color:#fff;box-shadow:0 0 18px rgba(0,229,255,0.35),inset 0 0 12px rgba(0,229,255,0.08)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ── 3D labels ── */
.marker-label{
  position:fixed;z-index:15;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;
  text-align:center;white-space:nowrap;transition:opacity .2s;
}
.marker-label .name{
  font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#eaffff;
  text-shadow:0 0 8px rgba(0,229,255,0.95),0 0 20px rgba(0,120,255,0.7);
}
.marker-label .meta{font-size:9px;letter-spacing:2px;color:var(--dim);margin-top:2px}
.marker-label .live{
  display:inline-block;margin-right:6px;width:5px;height:5px;border-radius:50%;
  background:var(--pink);box-shadow:0 0 8px var(--pink);animation:blink 1.6s infinite;vertical-align:1px;
}
.marker-label:hover .name{color:var(--cyan)}

/* ── stream panel ── */
#panel{
  position:fixed;z-index:40;top:20px;right:20px;width:min(420px,calc(100vw - 40px));
  background:var(--panel);border:1px solid var(--edge);border-radius:4px;
  box-shadow:0 0 40px rgba(0,120,255,0.25),inset 0 0 30px rgba(0,90,255,0.05);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transform:translateX(calc(100% + 40px));transition:transform .45s cubic-bezier(.22,.9,.3,1);
  overflow:hidden;
}
#panel.open{transform:translateX(0)}
#panel .topline{height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 12px var(--cyan)}
#panel header{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 18px 12px}
#panel h2{font-size:15px;letter-spacing:4px;text-transform:uppercase;color:#eaffff;text-shadow:0 0 10px rgba(0,229,255,0.8)}
#panel .coords{font-size:9.5px;letter-spacing:1.5px;color:var(--dim);margin-top:6px;line-height:1.8}
#panel .coords b{color:var(--cyan);font-weight:400}
#close{
  font:inherit;background:none;border:1px solid rgba(0,229,255,0.3);color:var(--dim);
  width:26px;height:26px;border-radius:3px;cursor:pointer;line-height:1;
}
#close:hover{color:#fff;border-color:var(--cyan);box-shadow:0 0 10px rgba(0,229,255,0.4)}
.feed{position:relative;margin:0 18px;aspect-ratio:16/10;background:#02040f;border:1px solid rgba(0,229,255,0.2);overflow:hidden}
.feed img{width:100%;height:100%;object-fit:cover;display:none}
.feed .static{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:
    repeating-linear-gradient(0deg,rgba(0,229,255,0.05) 0 1px,transparent 1px 4px),
    radial-gradient(ellipse at 50% 60%,rgba(0,90,255,0.22),transparent 70%),#03071c;
}
.feed .static .sig{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);animation:blink 2s infinite}
.feed .static a{
  font:inherit;font-size:11px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;
  color:#031022;background:var(--cyan);padding:10px 16px;border-radius:2px;font-weight:700;
  box-shadow:0 0 20px rgba(0,229,255,0.6);
}
.feed .static a:hover{background:#fff}
.feed .scanline{position:absolute;left:0;right:0;height:20%;background:linear-gradient(180deg,transparent,rgba(0,229,255,0.10),transparent);animation:scanmove 3.5s linear infinite;pointer-events:none}
@keyframes scanmove{0%{top:-20%}100%{top:120%}}
#panel .status{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
#panel .status .live-tag{color:var(--pink);text-shadow:0 0 8px rgba(255,45,149,0.7)}
#panel .status .live-tag::before{content:'●';margin-right:6px;animation:blink 1.6s infinite;display:inline-block}
#panel footer{padding:0 18px 16px}
#panel footer a{
  display:block;text-align:center;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;
  color:var(--cyan);border:1px solid rgba(0,229,255,0.35);padding:10px;border-radius:3px;transition:all .25s;
}
#panel footer a:hover{background:rgba(0,229,255,0.1);box-shadow:0 0 16px rgba(0,229,255,0.3)}
#panel .credit{font-size:8.5px;letter-spacing:1.5px;color:rgba(160,215,255,0.35);text-align:center;margin-top:8px;text-transform:uppercase}

/* loading / error */
#boot{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
  background:var(--bg);transition:opacity .8s;letter-spacing:4px;text-transform:uppercase;font-size:11px;color:var(--cyan);
}
#boot.done{opacity:0;pointer-events:none}
#boot .grid-anim{width:120px;height:2px;background:rgba(0,229,255,0.15);position:relative;overflow:hidden}
#boot .grid-anim i{position:absolute;inset:0;width:40%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:load 1.1s ease-in-out infinite alternate}
@keyframes load{0%{left:0}100%{left:60%}}

@media (max-width:640px){
  #hud-top{top:14px;left:16px}
  #hud-top h1{letter-spacing:3px}
  #hud-scan{display:none}
  #hud-hint{display:none}
  #chips{bottom:14px;gap:6px}
  .chip{padding:8px 10px;font-size:10px;letter-spacing:1px}
  #panel{top:auto;bottom:0;right:0;left:0;width:100%;border-radius:12px 12px 0 0;transform:translateY(110%)}
  #panel.open{transform:translateY(0)}
}
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="crt"></div>

<div class="hud" id="hud-top">
  <a class="back" href="/">← ricburton.com</a>
  <h1>Bay Area <span>//</span> Webcam Grid</h1>
  <div class="sub">Fort Funston <b>·</b> Mussel Rock <b>·</b> Mt Tam <b>·</b> Mt Diablo</div>
</div>

<div class="hud" id="hud-scan">
  Elevation scan
  <div class="bar"><i id="scanbar"></i></div>
  <span class="val" id="scanval">0 m</span> / 1250 m<br>
  contour interval 50 m · index 250 m
</div>

<div class="hud" id="hud-hint">
  drag · orbit<br>scroll · zoom<br>tap a beacon · live feed
</div>

<div id="chips"></div>

<div id="panel">
  <div class="topline"></div>
  <header>
    <div>
      <h2 id="p-name"></h2>
      <div class="coords" id="p-coords"></div>
    </div>
    <button id="close" aria-label="Close">×</button>
  </header>
  <div class="feed">
    <img id="p-img" alt="Live webcam frame">
    <div class="static" id="p-static">
      <div class="sig">◍ acquiring signal…</div>
      <a id="p-static-link" href="#" target="_blank" rel="noopener">Open live stream ↗</a>
    </div>
    <div class="scanline"></div>
  </div>
  <div class="status">
    <span id="p-status">standby</span>
    <span id="p-refresh"></span>
  </div>
  <footer>
    <a id="p-link" href="#" target="_blank" rel="noopener">Open live stream ↗</a>
    <div class="credit" id="p-credit"></div>
  </footer>
</div>

<div id="boot">
  <div>Rendering terrain</div>
  <div class="grid-anim"><i></i></div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
}}
</script>

<script type="module">
const boot = document.getElementById('boot');
let THREE, OrbitControls;
try{
  THREE = await import('three');
  ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
}catch(e){
  boot.firstElementChild.textContent = 'Could not load 3D engine — check your connection';
  throw e;
}

/* ═══════════════════ Webcams ═══════════════════
   Each cam tries its candidate live-frame URLs in order in YOUR browser;
   whichever loads becomes the feed (refreshed every 60 s). If none load
   (feed moved, or the source blocks hotlinking) the panel falls back to a
   direct link to the official live stream. */
const CAMS = [
  {
    id:'funston', name:'Fort Funston', sub:'THE FORT · COASTAL SOARING',
    lat:37.7168, lon:-122.5030, elevM:60, elevLabel:'200 FT BLUFF',
    sources:[
      'https://archive.flyfunston.org/newwebcam/fortfunstoncam.jpg',
      'https://archive.flyfunston.org/webcam/fortfunstoncam.jpg',
      'https://flyfunston.org/webcam/fortfunstoncam.jpg'
    ],
    link:'https://flyfunston.org/dashboard/',
    credit:'Fellow Feathers of Fort Funston'
  },
  {
    id:'musselrock', name:'Mussel Rock', sub:'THE DUMPS · DALY CITY',
    lat:37.6742, lon:-122.4935, elevM:150, elevLabel:'500 FT CLIFFS',
    sources:[
      'https://flypacifica.com/cams/musselrock/latest.jpg'
    ],
    link:'https://flypacifica.com/',
    credit:'Fly Pacifica'
  },
  {
    id:'mttam', name:'Mt Tamalpais', sub:'EAST PEAK · MARIN',
    lat:37.9235, lon:-122.5965, elevM:784, elevLabel:'2,571 FT',
    sources:[
      'https://cameras.alertcalifornia.org/public-camera-data/Axis-MtTamEast/latest-frame.jpg',
      'https://cameras.alertcalifornia.org/public-camera-data/Axis-MtTamalpaisEast/latest-frame.jpg',
      'https://cameras.alertcalifornia.org/public-camera-data/Axis-MtTamWest/latest-frame.jpg'
    ],
    link:'https://alertwest.live/cam-console/2192',
    credit:'ALERTCalifornia · UC San Diego'
  },
  {
    id:'mtdiablo', name:'Mt Diablo', sub:'SUMMIT · CONTRA COSTA',
    lat:37.8816, lon:-121.9143, elevM:1173, elevLabel:'3,849 FT',
    sources:[
      'https://cameras.alertcalifornia.org/public-camera-data/Axis-MtDiablo/latest-frame.jpg',
      'https://cameras.alertcalifornia.org/public-camera-data/Axis-MountDiablo/latest-frame.jpg'
    ],
    link:'https://alertwest.live/cam-console/2156',
    credit:'ALERTCalifornia · UC San Diego'
  }
];

/* ═══════════════════ Geography ═══════════════════ */
const LON0=-122.82, LON1=-121.80, LAT0=37.28, LAT1=38.22;
const W=86, D=100;                 // world units
const S=0.0115;                    // vertical exaggeration: world units per metre
const RES=256;

const toX = lon => ((lon-LON0)/(LON1-LON0)-0.5)*W;
const toZ = lat => ((LAT1-lat)/(LAT1-LAT0)-0.5)*D;
// distance helper in "latitude degrees" with longitude compressed by cos(38°)
const KX=0.79;
const d2=(lon,lat,lon2,lat2)=>{const dx=(lon-lon2)*KX, dy=lat-lat2; return dx*dx+dy*dy;};
const segD2=(lon,lat,a,b)=>{
  const ax=a[0]*KX, ay=a[1], bx=b[0]*KX, by=b[1], px=lon*KX, py=lat;
  const vx=bx-ax, vy=by-ay, wx=px-ax, wy=py-ay;
  const len2=vx*vx+vy*vy;
  const t=len2>0?Math.max(0,Math.min(1,(wx*vx+wy*vy)/len2)):0;
  const dx=px-(ax+vx*t), dy=py-(ay+vy*t); return dx*dx+dy*dy;
};
const gauss=(dd,sig)=>Math.exp(-dd/(2*sig*sig));
const sstep=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};

// Terrain features: [type, ...geometry, heightMetres, sigmaDegrees]
const peak =(lon,lat,h,s)=>p=>h*gauss(d2(p[0],p[1],lon,lat),s);
const ridge=(a,b,h,s)=>p=>h*gauss(segD2(p[0],p[1],a,b),s);
const FEATS=[
  peak(-122.5965,37.9235, 784,0.030),                       // Mt Tam East Peak
  ridge([-122.66,37.930],[-122.585,37.923], 620,0.040),     // Tam massif
  ridge([-122.72,38.03],[-122.63,37.945], 420,0.030),       // Bolinas Ridge
  peak(-122.520,37.828, 290,0.028),                         // Marin Headlands
  peak(-122.545,38.035, 440,0.038),                         // Big Rock Ridge
  peak(-122.600,38.130, 400,0.045),                         // Mt Burdell
  peak(-122.240,38.170, 380,0.060),                         // north hills
  peak(-121.9143,37.8816, 1173,0.058),                      // Mt Diablo
  peak(-121.892,37.897, 980,0.028),                         // Diablo North Peak
  ridge([-122.02,37.82],[-121.95,37.86], 420,0.030),        // Diablo foothills
  ridge([-122.245,37.925],[-122.10,37.77], 500,0.026),      // East Bay hills
  ridge([-122.10,37.77],[-121.97,37.68], 340,0.026),        // Chabot ridge
  peak(-121.881,37.512, 1080,0.045),                        // Mission Peak
  ridge([-121.955,37.66],[-121.90,37.56], 420,0.028),       // Pleasanton Ridge
  ridge([-122.455,37.687],[-122.402,37.680], 390,0.016),    // San Bruno Mtn
  peak(-122.447,37.752, 270,0.013),                         // Twin Peaks
  peak(-122.503,37.7168, 70,0.011),                         // Fort Funston bluff
  ridge([-122.494,37.700],[-122.489,37.655], 170,0.011),    // Mussel Rock cliffs
  ridge([-122.475,37.605],[-122.445,37.635], 360,0.014),    // Sweeney Ridge
  peak(-122.455,37.556, 575,0.030),                         // Montara Mtn
  ridge([-122.40,37.49],[-122.16,37.295], 720,0.048),       // Santa Cruz Mtns
  peak(-122.430,37.858, 235,0.013)                          // Angel Island
];

// Pacific coastline: [lat, lon] north-bound
const COAST=[
  [37.28,-122.410],[37.46,-122.455],[37.52,-122.485],[37.60,-122.500],
  [37.66,-122.495],[37.71,-122.507],[37.79,-122.513],[37.812,-122.527],
  [37.832,-122.540],[37.87,-122.585],[37.905,-122.645],[37.95,-122.690],
  [38.05,-122.760],[38.22,-122.820]
];
function coastLon(lat){
  if(lat<=COAST[0][0])return COAST[0][1];
  for(let i=1;i<COAST.length;i++){
    if(lat<=COAST[i][0]){
      const [l0,x0]=COAST[i-1],[l1,x1]=COAST[i];
      return x0+(x1-x0)*(lat-l0)/(l1-l0);
    }
  }
  return COAST[COAST.length-1][1];
}
// Bay water bodies as capsules/blobs → waterness 0..1
const WATER=[
  [[-122.530,37.818],[-122.446,37.825],0.016],  // Golden Gate strait
  [[-122.455,37.880],[-122.350,37.800],0.050],  // Central Bay
  [[-122.480,37.873],[-122.480,37.873],0.020],  // Richardson Bay
  [[-122.330,37.755],[-122.060,37.480],0.052],  // South Bay
  [[-122.395,38.065],[-122.395,38.065],0.092],  // San Pablo Bay
  [[-122.300,38.060],[-121.830,38.055],0.024]   // Carquinez → Suisun
];
function waterness(lon,lat){
  const c=coastLon(lat);
  let w=1-sstep(c-0.012,c+0.004,lon);           // Pacific
  for(const [a,b,r] of WATER){
    const d=Math.sqrt(segD2(lon,lat,a,b));
    w=Math.max(w,1-sstep(r*0.72,r,d));
  }
  w*=1-0.96*gauss(d2(lon,lat,-122.430,37.858),0.011); // keep Angel Island
  return Math.min(1,Math.max(0,w));
}
function baseNoise(lon,lat){
  const x=lon*40,y=lat*40;
  let n=Math.sin(x*1.7+y*2.3)*Math.sin(x*0.9-y*1.1)
       +0.5*Math.sin(x*4.1+y*3.3)*Math.sin(x*2.7+y*5.9);
  return Math.max(14,26+n*15);
}
function elevAt(lon,lat){
  let h=0;
  const p=[lon,lat];
  for(const f of FEATS)h=Math.max(h,f(p));
  // roughen the analytic cones so contours aren't perfect circles
  const x=lon*90,y=lat*90;
  h*=0.90+0.20*(0.5+0.5*Math.sin(x*1.3+y*2.1)*Math.sin(x*0.7-y*1.7));
  h=Math.max(h,baseNoise(lon,lat));
  const w=waterness(lon,lat);
  return h*(1-w)-95*w;
}

/* ═══════════════════ Scene ═══════════════════ */
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x04071a);
scene.fog=new THREE.FogExp2(0x04071a,0.0028);

const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.1,900);
camera.position.set(-30,62,92);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2,-4);
controls.enableDamping=true;
controls.dampingFactor=0.06;
controls.autoRotate=true;
controls.autoRotateSpeed=0.35;
controls.minDistance=25;
controls.maxDistance=220;
controls.maxPolarAngle=Math.PI*0.49;
let lastInteract=-99;
controls.addEventListener('start',()=>{lastInteract=clock?clock.getElapsedTime():0;});

/* ── terrain ── */
const geo=new THREE.PlaneGeometry(W,D,RES-1,RES-1);
geo.rotateX(-Math.PI/2);
const pos=geo.attributes.position;
const elevArr=new Float32Array(pos.count);
for(let i=0;i<pos.count;i++){
  const x=pos.getX(i),z=pos.getZ(i);
  const lon=LON0+(x/W+0.5)*(LON1-LON0);
  const lat=LAT1-(z/D+0.5)*(LAT1-LAT0);
  const e=elevAt(lon,lat);
  elevArr[i]=e;
  pos.setY(i,e*S);
}
geo.setAttribute('elev',new THREE.BufferAttribute(elevArr,1));
geo.computeVertexNormals();

const uniforms={
  uTime:{value:0},
  uScanMax:{value:1250},
  uMinor:{value:50},
  uMajor:{value:250},
  uFog:{value:new THREE.Color(0x04071a)}
};
const terrainMat=new THREE.ShaderMaterial({
  uniforms,
  vertexShader:/*glsl*/`
    attribute float elev;
    varying float vE; varying vec3 vW; varying vec3 vN;
    void main(){
      vE=elev;
      vec4 wp=modelMatrix*vec4(position,1.0);
      vW=wp.xyz;
      vN=normalize(normalMatrix*normal);
      gl_Position=projectionMatrix*viewMatrix*wp;
    }`,
  fragmentShader:/*glsl*/`
    varying float vE; varying vec3 vW; varying vec3 vN;
    uniform float uTime,uScanMax,uMinor,uMajor;
    uniform vec3 uFog;
    float contour(float e,float step){
      float g=e/step;
      float f=abs(fract(g-0.5)-0.5)/max(fwidth(g),1e-4);
      return 1.0-min(f,1.0);
    }
    void main(){
      float t=clamp(vE/1200.0,0.0,1.0);
      vec3 col=mix(vec3(0.040,0.10,0.26),vec3(0.043,0.16,0.42),smoothstep(0.0,0.18,t));
      col=mix(col,vec3(0.066,0.32,0.75),smoothstep(0.18,0.45,t));
      col=mix(col,vec3(0.09,0.58,0.94),smoothstep(0.45,0.75,t));
      col=mix(col,vec3(0.55,0.95,1.0),smoothstep(0.75,1.0,t));
      if(vE<2.0)col=mix(vec3(0.012,0.03,0.10),vec3(0.028,0.075,0.20),clamp((vE+95.0)/97.0,0.0,1.0));

      // hillshade from a cool key light
      float dif=clamp(dot(normalize(vN),normalize(vec3(-0.5,0.8,0.35))),0.0,1.0);
      col*=0.45+0.75*dif;

      // ── height lines ──
      float land=smoothstep(2.0,14.0,vE);
      float minor=contour(vE,uMinor)*0.38;
      float major=contour(vE,uMajor)*0.9;
      vec3 lineCol=vec3(0.15,0.85,1.0);
      col+=lineCol*minor*land;
      col+=lineCol*major*land*1.25;

      // rising elevation scan lights the contours it passes
      float scanE=fract(uTime*0.055)*uScanMax;
      float band=exp(-pow((vE-scanE)/22.0,2.0));
      col+=vec3(0.55,0.98,1.0)*band*land*(0.35+1.4*max(minor,major));

      // shoreline glow
      float shore=exp(-pow((vE-1.0)/5.0,2.0));
      col+=vec3(0.1,0.65,1.0)*shore*0.55;

      // rim light on peaks
      vec3 V=normalize(cameraPosition-vW);
      float rim=pow(1.0-clamp(dot(normalize(vN),V),0.0,1.0),3.0);
      col+=vec3(0.1,0.5,1.0)*rim*0.45*land;

      // fade map edges into the void
      float edge=max(abs(vW.x)/(0.5*${W.toFixed(1)}),abs(vW.z)/(0.5*${D.toFixed(1)}));
      col=mix(col,uFog,smoothstep(0.86,1.0,edge));
      gl_FragColor=vec4(col,1.0);
    }`
});
scene.add(new THREE.Mesh(geo,terrainMat));

/* ── ocean grid ── */
const oceanGeo=new THREE.PlaneGeometry(W+240,D+240,120,120);
oceanGeo.rotateX(-Math.PI/2);
const oceanMat=new THREE.ShaderMaterial({
  uniforms,
  transparent:true,
  depthWrite:false,
  vertexShader:/*glsl*/`
    uniform float uTime;
    varying vec3 vW;
    void main(){
      vec3 p=position;
      p.y+=0.12*sin(p.x*0.35+uTime*1.1)*sin(p.z*0.3-uTime*0.8);
      vec4 wp=modelMatrix*vec4(p,1.0);
      vW=wp.xyz;
      gl_Position=projectionMatrix*viewMatrix*wp;
    }`,
  fragmentShader:/*glsl*/`
    uniform float uTime;
    uniform vec3 uFog;
    varying vec3 vW;
    void main(){
      vec2 g=vW.xz*0.5+vec2(0.0,uTime*0.35);
      vec2 f=abs(fract(g-0.5)-0.5)/fwidth(g);
      float line=1.0-min(min(f.x,f.y),1.0);
      float pulse=0.75+0.25*sin(uTime*1.5-length(vW.xz)*0.12);
      vec3 col=vec3(0.016,0.05,0.16);
      col+=vec3(0.10,0.42,1.0)*line*pulse*0.9;
      float dist=length(vW.xz);
      col=mix(col,uFog,smoothstep(90.0,210.0,dist));
      float a=mix(0.92,0.0,smoothstep(120.0,210.0,dist));
      gl_FragColor=vec4(col,a);
    }`
});
const ocean=new THREE.Mesh(oceanGeo,oceanMat);
ocean.position.y=0.1;
scene.add(ocean);

/* ── stars ── */
{
  const n=1400,sp=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const th=Math.random()*Math.PI*2, ph=Math.acos(Math.random()*0.85), r=380+Math.random()*80;
    sp[i*3]=r*Math.sin(ph)*Math.cos(th);
    sp[i*3+1]=r*Math.cos(ph)+5;
    sp[i*3+2]=r*Math.sin(ph)*Math.sin(th);
  }
  const sg=new THREE.BufferGeometry();
  sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({
    color:0x9fd4ff,size:1.4,sizeAttenuation:false,transparent:true,opacity:0.75,
    blending:THREE.AdditiveBlending,depthWrite:false
  })));
}

/* ── beacons ── */
function glowTexture(){
  const c=document.createElement('canvas');c.width=c.height=128;
  const g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(190,255,255,1)');
  gr.addColorStop(0.25,'rgba(0,229,255,0.85)');
  gr.addColorStop(1,'rgba(0,60,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const glowTex=glowTexture();
const beamMat=phase=>new THREE.ShaderMaterial({
  uniforms:{uTime:uniforms.uTime,uPhase:{value:phase}},
  transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:/*glsl*/`
    varying vec2 vUv;uniform float uTime,uPhase;
    void main(){
      float a=pow(1.0-vUv.y,2.2)*(0.55+0.45*sin(uTime*2.2+uPhase));
      gl_FragColor=vec4(0.15,0.85,1.0,a*0.85);
    }`
});
const markers=[],hitTargets=[],rings=[];
const labelLayer=document.body;
CAMS.forEach((cam,i)=>{
  const x=toX(cam.lon),z=toZ(cam.lat);
  const y=Math.max(elevAt(cam.lon,cam.lat),cam.elevM)*S;
  const beamH=9;
  const grp=new THREE.Group();
  grp.position.set(x,y,z);

  const beam=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.5,beamH,20,1,true),beamMat(i*1.7));
  beam.position.y=beamH/2;
  grp.add(beam);

  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
  spr.scale.set(4.5,4.5,1);
  spr.position.y=0.6;
  grp.add(spr);

  for(let k=0;k<3;k++){
    const ring=new THREE.Mesh(
      new THREE.RingGeometry(0.92,1.0,48),
      new THREE.MeshBasicMaterial({color:0x00c8ff,transparent:true,opacity:0.5,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false})
    );
    ring.rotation.x=-Math.PI/2;
    ring.position.y=0.35;
    ring.userData.off=k/3;
    grp.add(ring);rings.push(ring);
  }

  const hit=new THREE.Mesh(new THREE.SphereGeometry(3.2),new THREE.MeshBasicMaterial({visible:false}));
  hit.position.y=beamH*0.4;
  hit.userData.cam=cam;
  grp.add(hit);hitTargets.push(hit);

  scene.add(grp);

  const el=document.createElement('div');
  el.className='marker-label';
  el.innerHTML=`<div class="name"><span class="live"></span>${cam.name}</div><div class="meta">${cam.elevLabel}</div>`;
  el.addEventListener('click',()=>openPanel(cam));
  labelLayer.appendChild(el);

  markers.push({cam,grp,el,topY:y+beamH*0.85});
});

/* ── chips ── */
const chipsEl=document.getElementById('chips');
CAMS.forEach(cam=>{
  const b=document.createElement('button');
  b.className='chip';b.dataset.cam=cam.id;
  b.innerHTML=`<span class="dot"></span>${cam.name}`;
  b.addEventListener('click',()=>openPanel(cam));
  chipsEl.appendChild(b);
});

/* ── picking ── */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
let downAt=null;
canvas.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY];});
canvas.addEventListener('pointerup',e=>{
  if(!downAt)return;
  const moved=Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]);
  downAt=null;
  if(moved>6)return;
  ptr.x=(e.clientX/innerWidth)*2-1;ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(hitTargets,false)[0];
  if(hit)openPanel(hit.object.userData.cam);
});
canvas.addEventListener('pointermove',e=>{
  ptr.x=(e.clientX/innerWidth)*2-1;ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  canvas.style.cursor=ray.intersectObjects(hitTargets,false).length?'pointer':'grab';
});

/* ── stream panel ── */
const panel=document.getElementById('panel');
const pName=document.getElementById('p-name'),pCoords=document.getElementById('p-coords'),
      pImg=document.getElementById('p-img'),pStatic=document.getElementById('p-static'),
      pStatus=document.getElementById('p-status'),pRefresh=document.getElementById('p-refresh'),
      pLink=document.getElementById('p-link'),pStaticLink=document.getElementById('p-static-link'),
      pCredit=document.getElementById('p-credit');
let feedTimer=null,activeCam=null;

function stopFeed(){if(feedTimer){clearInterval(feedTimer);feedTimer=null;}}
function bust(u){return u+(u.includes('?')?'&':'?')+'t='+Date.now();}

function startFeed(cam){
  stopFeed();
  pImg.style.display='none';pImg.removeAttribute('src');
  pStatic.style.display='flex';
  pStatic.querySelector('.sig').textContent='◍ acquiring signal…';
  pStatus.textContent='searching feed';pRefresh.textContent='';
  let i=0;
  const tryNext=()=>{
    if(cam!==activeCam)return;
    if(i>=cam.sources.length){
      pStatic.querySelector('.sig').textContent='▢ direct frame unavailable — open the live stream';
      pStatus.textContent='external stream';
      return;
    }
    const url=cam.sources[i++],probe=new Image();
    probe.onload=()=>{
      if(cam!==activeCam)return;
      pImg.src=probe.src;pImg.style.display='block';pStatic.style.display='none';
      pStatus.innerHTML='<span class="live-tag">live frame</span>';
      pRefresh.textContent='refreshes · 60 s';
      feedTimer=setInterval(()=>{
        const next=new Image();
        next.onload=()=>{if(cam===activeCam)pImg.src=next.src;};
        next.src=bust(url);
      },60000);
    };
    probe.onerror=tryNext;
    probe.src=bust(url);
  };
  tryNext();
}
function openPanel(cam){
  activeCam=cam;
  pName.textContent=cam.name;
  pCoords.innerHTML=`${cam.sub}<br><b>${cam.lat.toFixed(4)}° N</b> / <b>${Math.abs(cam.lon).toFixed(4)}° W</b> · <b>${cam.elevLabel}</b>`;
  pLink.href=cam.link;pStaticLink.href=cam.link;
  pCredit.textContent='feed · '+cam.credit;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.cam===cam.id));
  panel.classList.add('open');
  startFeed(cam);
}
document.getElementById('close').addEventListener('click',()=>{
  panel.classList.remove('open');activeCam=null;stopFeed();
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
});

/* ── loop ── */
const scanval=document.getElementById('scanval'),scanbar=document.getElementById('scanbar');
const clock=new THREE.Clock();
const v=new THREE.Vector3();
function tick(){
  requestAnimationFrame(tick);
  const t=clock.getElapsedTime();
  uniforms.uTime.value=t;
  controls.autoRotate=(t-lastInteract)>8;
  controls.update();

  for(const r of rings){
    const s=(t*0.45+r.userData.off)%1;
    const sc=0.6+s*6.5;
    r.scale.set(sc,sc,1);
    r.material.opacity=(1-s)*0.55;
  }
  for(const m of markers){
    v.set(m.grp.position.x,m.topY+1.6,m.grp.position.z).project(camera);
    const behind=v.z>1;
    m.el.style.opacity=behind?0:1;
    m.el.style.pointerEvents=behind?'none':'auto';
    m.el.style.left=(v.x*0.5+0.5)*innerWidth+'px';
    m.el.style.top=(-v.y*0.5+0.5)*innerHeight+'px';
  }
  const scanE=(t*0.055%1)*uniforms.uScanMax.value;
  scanval.textContent=Math.round(scanE)+' m';
  scanbar.style.left=Math.min(70,(scanE/uniforms.uScanMax.value)*100*0.7)+'%';

  renderer.render(scene,camera);
}
tick();
boot.classList.add('done');

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
