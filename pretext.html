<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Richard Burton</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0a0a0a;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 32px 16px;
  }
  canvas {
    display: block;
    border-radius: 8px;
    background: #1a1a1a;
    max-width: 100%;
    cursor: default;
  }
  .links {
    display: flex;
    gap: 20px;
    margin-top: 24px;
    font-family: "SF Mono", ui-monospace, monospace;
    font-size: 13px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .links a {
    color: #555;
    text-decoration: none;
    transition: color 0.2s;
  }
  .links a:hover {
    color: #e0e0e0;
  }
  .stats {
    font-family: "SF Mono", ui-monospace, monospace;
    font-size: 12px;
    color: #333;
    margin-top: 16px;
    text-align: center;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<nav class="links">
  <a href="https://x.com/ricburton" target="_blank">X</a>
  <a href="https://youtube.com/@r1cburton" target="_blank">YouTube</a>
  <a href="https://ricburton.substack.com" target="_blank">Substack</a>
  <a href="https://soundcloud.com/ricburton" target="_blank">Soundcloud</a>
  <a href="https://github.com/ricburton" target="_blank">Github</a>
  <a href="https://vimeo.com/ricburton" target="_blank">Vimeo</a>
</nav>

<div class="stats" id="stats"></div>

<script type="module">
import {
  prepareWithSegments,
  layoutWithLines
} from 'https://esm.sh/@chenglou/pretext'

const TEXT = `Richard Burton is a designer and engineer interested in interfaces, film, music and the internet.`

const TITLE_FONT = 'bold 28px system-ui, -apple-system, sans-serif'
const BODY_FONT = '18px/30px Georgia, "Times New Roman", serif'
const BODY_FONT_CANVAS = '18px Georgia, Times New Roman, serif'
const TITLE = 'Richard Burton'
const LINE_HEIGHT = 30
const TITLE_LINE_HEIGHT = 36
const PADDING = 48
const GAP = 32

const canvas = document.getElementById('canvas')
const ctx = canvas.getContext('2d')
const stats = document.getElementById('stats')
const dpr = window.devicePixelRatio || 1

let titlePrepared, bodyPrepared

function init() {
  titlePrepared = prepareWithSegments(TITLE, TITLE_FONT)
  bodyPrepared = prepareWithSegments(TEXT, BODY_FONT_CANVAS)
  render()
}

function render() {
  const maxW = Math.min(640, window.innerWidth - 32)
  const contentW = maxW - PADDING * 2

  const t0 = performance.now()
  const titleLayout = layoutWithLines(titlePrepared, contentW, TITLE_LINE_HEIGHT)
  const bodyLayout = layoutWithLines(bodyPrepared, contentW, LINE_HEIGHT)
  const layoutMs = (performance.now() - t0).toFixed(3)

  const totalHeight = PADDING + titleLayout.height + GAP + bodyLayout.height + PADDING

  canvas.style.width = maxW + 'px'
  canvas.style.height = totalHeight + 'px'
  canvas.width = maxW * dpr
  canvas.height = totalHeight * dpr
  ctx.scale(dpr, dpr)

  // Background
  ctx.fillStyle = '#1a1a1a'
  ctx.roundRect(0, 0, maxW, totalHeight, 8)
  ctx.fill()

  // Title
  ctx.font = TITLE_FONT
  ctx.fillStyle = '#e0e0e0'
  let y = PADDING + TITLE_LINE_HEIGHT * 0.8
  for (const line of titleLayout.lines) {
    ctx.fillText(line.text, PADDING, y)
    y += TITLE_LINE_HEIGHT
  }

  // Body
  ctx.font = BODY_FONT_CANVAS
  ctx.fillStyle = '#999'
  y = PADDING + titleLayout.height + GAP + LINE_HEIGHT * 0.8
  for (const line of bodyLayout.lines) {
    ctx.fillText(line.text, PADDING, y)
    y += LINE_HEIGHT
  }

  stats.textContent = `pretext layout: ${layoutMs}ms · ${bodyLayout.lineCount} lines`
}

window.addEventListener('resize', () => {
  ctx.setTransform(1, 0, 0, 1, 0, 0)
  render()
})

init()
</script>

</body>
</html>
